# suppress inspection "UnusedProperty" for whole file
server:
  port: 8090
# emulator has different port, this is default livereload port
spring:
  devtools:
    livereload:
      port=35729

# OpenApi
springdoc:
  swagger-ui:
    path: /swagger-ui
    operationsSorter: alpha
    tagsSorter: alpha
  api-docs:
    path: /api-docs
# merged spec always generates 'servers: - url: "http://localhost:8080"'
restapiUrl: http://localhost:8091
stomp:
  url: ws://localhost:8091/stomp