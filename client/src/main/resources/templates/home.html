<!doctype html>
<!--suppress HtmlUnknownTag -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Client</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
<!-- import header.html-->
<div th:replace="~{template :: header}"></div>
<!-- //import header.html-->

<section class="services-w3l-block py-5">
    <div class="container">
        <div class="alert alert-warning" th:if="${!#strings.isEmpty(message)}" th:text="${message}"></div>
        <h2>Device Status</h2>
        <p>Read only. Log in to the Service Client to send commands.</p>
        <div th:replace="~{status :: statusTable}"></div>
    </div>
</section>

<!-- live update of the device status via Server-Sent Events -->
<!--suppress HtmlUnknownTarget -->
<script data-status-url="/public/status" src="/assets/js/eventStream.js"></script>
</body>
</html>
