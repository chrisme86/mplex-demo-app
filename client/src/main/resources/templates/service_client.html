<!doctype html>
<!--suppress HtmlUnknownTag -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Client</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        h2,h3,h4 {
            margin-top: 40px;
        }
    </style>
</head>

<body>
<div th:replace="~{template :: header}">...</div>

<section class="services-w3l-block py-5">
    <h1>Service Client</h1>
    <div class="alert alert-warning" th:if="${!#strings.isEmpty(message)}" th:text="${message}"></div>
    <h4>Devices</h4>
    <div th:replace="~{status :: statusTable}"></div>
</section>
<!-- live update of the device status via Server-Sent Events -->
<!--suppress HtmlUnknownTarget -->
<script data-status-url="/service_client/status" src="/assets/js/eventStream.js"></script>
</body>
</html>
