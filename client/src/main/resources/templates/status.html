<!doctype html>
<!--suppress HtmlUnknownTag -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- device status (connection + current states), used by home and service client, reloaded via SSE.
     serviceMode (service client, login): shows the commands and the Reconnect button -->
<div id="status" th:fragment="statusTable">
    <div class="mb-3" id="connection">
        <span>Connection to device: </span>
        <span th:if="${connectionState.name() == 'CONNECTED'}">
            <i class="bi bi-check-circle-fill" style="color: green;"></i> connected
        </span>
        <span th:if="${connectionState.name() == 'CONNECTING'}">
            <i class="bi bi-hourglass-split" style="color: orange;"></i> connecting
            <span th:if="${connectionRetry > 0}" th:text="|(retry ${connectionRetry}/${connectionMaxRetries})|"></span>
        </span>
        <span th:if="${connectionState.name() == 'DISCONNECTED'}">
            <i class="bi bi-x-circle-fill" style="color: red;"></i> disconnected
            <form class="d-inline ms-2" method="post" th:action="@{/service_client/reconnect}" th:if="${serviceMode}">
                <button class="btn btn-sm btn-outline-primary" type="submit">Reconnect</button>
            </form>
        </span>
    </div>
    <table class="table align-middle">
        <thead>
        <tr>
            <th>Subsystem</th>
            <th>Topic</th>
            <th th:if="${serviceMode}">Command</th>
            <th>Current State</th>
        </tr>
        </thead>
        <tbody id="events">
        <tr th:with="deviceState=${heaterStatus.waterHeater}">
            <td th:text="${deviceState.subsystem}"></td>
            <td th:text="${deviceState.topic}"></td>
            <td th:if="${serviceMode}">
                <!-- the clicked button sends its value -->
                <form method="post" th:action="@{/service_client/sendWaterHeaterCommand}">
                    <button class="btn btn-primary btn-sm" name="isOn" type="submit" value="true">On</button>
                    <button class="btn btn-outline-primary btn-sm" name="isOn" type="submit" value="false">Off</button>
                </form>
            </td>
            <td th:replace="~{status :: stateCell(${deviceState})}"></td>
        </tr>
        <tr th:with="deviceState=${heaterStatus.errors}">
            <td th:text="${deviceState.subsystem}"></td>
            <td th:text="${deviceState.topic}"></td>
            <td th:if="${serviceMode}"></td>
            <td th:replace="~{status :: stateCell(${deviceState})}"></td>
        </tr>
        <tr th:with="deviceState=${brewerStatus.waterPump}">
            <td th:text="${deviceState.subsystem}"></td>
            <td th:text="${deviceState.topic}"></td>
            <td th:if="${serviceMode}">
                <form method="post" th:action="@{/service_client/sendWaterPumpCommand}">
                    <button class="btn btn-primary btn-sm" name="isOn" type="submit" value="true">On</button>
                    <button class="btn btn-outline-primary btn-sm" name="isOn" type="submit" value="false">Off</button>
                </form>
            </td>
            <td th:replace="~{status :: stateCell(${deviceState})}"></td>
        </tr>
        <tr th:with="deviceState=${brewerStatus.errors}">
            <td th:text="${deviceState.subsystem}"></td>
            <td th:text="${deviceState.topic}"></td>
            <td th:if="${serviceMode}"></td>
            <td th:replace="~{status :: stateCell(${deviceState})}"></td>
        </tr>
        </tbody>
    </table>
</div>

<!-- state as badge, same colors as the command buttons: filled = on, outlined = off;
     plus "pending" while a command waits for its result event -->
<td th:fragment="stateCell(deviceState)">
    <th:block th:switch="${deviceState.currentState}">
        <span class="text-secondary" th:case="${null}">unknown</span>
        <span class="badge text-bg-primary" th:case="'ON'" th:text="${deviceState.currentState}"></span>
        <span class="badge border border-primary text-primary" th:case="'OFF'" th:text="${deviceState.currentState}"></span>
        <span class="badge text-bg-secondary" th:case="'NONE'" th:text="${deviceState.currentState}"></span>
        <span class="badge text-bg-danger" th:case="*" th:text="${deviceState.currentState}"></span>
    </th:block>
    <span class="ms-2 text-secondary" th:if="${deviceState.pendingCommandId != null}">
        <i class="bi bi-hourglass-split"></i> pending
    </span>
    <span class="ms-2 small text-danger" th:if="${deviceState.commandError != null}" th:text="${deviceState.commandError}"></span>
</td>
</body>
</html>
