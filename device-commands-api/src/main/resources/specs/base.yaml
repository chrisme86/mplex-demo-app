openapi: 3.0.1
info:
  title: Base API
  description: Base definitions for common components and paths
  version: 1.0.0

# merged spec always generates 'servers: - url: "http://localhost:8080"' anyways...
#servers:
#  - url: http://localhost:8091

components:
  schemas:
    # error body as sent by Spring's ProblemDetail (RFC 9457, media type application/problem+json)
    Problem:
      type: object
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Conflict
        status:
          type: integer
          example: 409
        detail:
          type: string
          example: Water heater is off
        instance:
          type: string
          example: /restapi/brewer/SetWaterPump

    # answer to a command: only the confirmation, the result comes asynchronously as event with this commandId
    CommandAccepted:
      type: object
      required: [ commandId ]
      properties:
        commandId:
          type: string
          format: uuid
          description: ID of the command, the result event carries the same ID

    BaseRequest:
      type: object
      properties:
        subsystem:
          type: string
          enum: [ brewer, heater ]
        topic:
          type: string
          example: ""
        parameters:
          type: object
          example: { }
        # not necessary anymore as events are handled by the websocket, and http has request and response by default
        # type:
        #   type: string
        #   enum: [ request ]
        # id:
        #   type: string
        #   format: uuid
