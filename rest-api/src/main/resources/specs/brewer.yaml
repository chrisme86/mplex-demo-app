openapi: 3.0.1
info:
  title: Brewer Commands API
  description: API to interact with the brewer subsystem commands
  version: 1.0.0

# merged spec always generates 'servers: - url: "http://localhost:8080"' anyways...
#servers:
#  - url: http://localhost:8091

paths:
  /restapi/brewer/SetWaterPump:
    post:
      tags: [ brewer ]
      summary: Send SetWaterPump request to the brewer subsystem
      operationId: setWaterPumpCommand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetWaterPumpRequest'
      responses:
        '202':
          description: Command accepted, the result follows as StatesEvent with the same commandId
          content:
            application/json:
              schema:
                $ref: 'base.yaml#/components/schemas/CommandAccepted'
        '400':
          description: Malformed request
          content:
            application/problem+json:
              schema:
                $ref: 'base.yaml#/components/schemas/Problem'
        '409':
          description: Pump can't be turned on while the brew valve is closed
          content:
            application/problem+json:
              schema:
                $ref: 'base.yaml#/components/schemas/Problem'

  /restapi/brewer/SetBrewValve:
    post:
      tags: [ brewer ]
      summary: Send SetBrewValve request to the brewer subsystem
      operationId: setBrewValveCommand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetBrewValveRequest'
      responses:
        '202':
          description: Command accepted, the result follows as StatesEvent with the same commandId
          content:
            application/json:
              schema:
                $ref: 'base.yaml#/components/schemas/CommandAccepted'
        '400':
          description: Malformed request
          content:
            application/problem+json:
              schema:
                $ref: 'base.yaml#/components/schemas/Problem'
        '409':
          description: Valve can't be closed while the water pump is running
          content:
            application/problem+json:
              schema:
                $ref: 'base.yaml#/components/schemas/Problem'

components:
  schemas:
    SetWaterPumpRequest:
      allOf:
        - $ref: 'base.yaml#/components/schemas/BaseRequest'
        - type: object
          required: [ subsystem, topic, parameters ]
          properties:
            subsystem:
              enum: [ brewer ]
              default: brewer
            topic:
              enum: [ SetWaterPump ]
              default: SetWaterPump
            parameters:
              type: object
              required: [ isOn ]
              properties:
                isOn:
                  type: boolean
                  description: Indicates whether the water pump should be turned on

    SetBrewValveRequest:
      allOf:
        - $ref: 'base.yaml#/components/schemas/BaseRequest'
        - type: object
          required: [ subsystem, topic, parameters ]
          properties:
            subsystem:
              enum: [ brewer ]
              default: brewer
            topic:
              enum: [ SetBrewValve ]
              default: SetBrewValve
            parameters:
              type: object
              required: [ isOpen ]
              properties:
                isOpen:
                  type: boolean
                  description: Indicates whether the brew valve should be opened
