openapi: 3.0.1
info:
  title: Fluidics Commands API
  description: API to interact with the fluidics subsystem commands
  version: 1.0.0

# merged spec always generates 'servers: - url: "http://localhost:8080"' anyways...
#servers:
#  - url: http://localhost:8091

paths:
  /restapi/fluidics/SetGelPump:
    post:
      tags: [ fluidics ]
      summary: Send SetGelPump request to the fluidics subsystem
      operationId: setGelPumpCommand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetGelPumpRequest'
      responses:
        '202':
          description: Command accepted, the result follows as StatesEvent with the same commandId
          content:
            application/json:
              schema:
                $ref: 'base.yaml#/components/schemas/CommandAccepted'
        '400':
          description: Malformed request
          content:
            application/problem+json:
              schema:
                $ref: 'base.yaml#/components/schemas/Problem'
        '409':
          description: Pump can't be turned on while the gel valve is closed
          content:
            application/problem+json:
              schema:
                $ref: 'base.yaml#/components/schemas/Problem'

  /restapi/fluidics/SetGelValve:
    post:
      tags: [ fluidics ]
      summary: Send SetGelValve request to the fluidics subsystem
      operationId: setGelValveCommand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetGelValveRequest'
      responses:
        '202':
          description: Command accepted, the result follows as StatesEvent with the same commandId
          content:
            application/json:
              schema:
                $ref: 'base.yaml#/components/schemas/CommandAccepted'
        '400':
          description: Malformed request
          content:
            application/problem+json:
              schema:
                $ref: 'base.yaml#/components/schemas/Problem'
        '409':
          description: Valve can't be closed while the gel pump is running
          content:
            application/problem+json:
              schema:
                $ref: 'base.yaml#/components/schemas/Problem'

components:
  schemas:
    SetGelPumpRequest:
      allOf:
        - $ref: 'base.yaml#/components/schemas/BaseRequest'
        - type: object
          required: [ subsystem, topic, parameters ]
          properties:
            subsystem:
              enum: [ fluidics ]
              default: fluidics
            topic:
              enum: [ SetGelPump ]
              default: SetGelPump
            parameters:
              type: object
              required: [ isOn ]
              properties:
                isOn:
                  type: boolean
                  description: Indicates whether the gel pump should be turned on

    SetGelValveRequest:
      allOf:
        - $ref: 'base.yaml#/components/schemas/BaseRequest'
        - type: object
          required: [ subsystem, topic, parameters ]
          properties:
            subsystem:
              enum: [ fluidics ]
              default: fluidics
            topic:
              enum: [ SetGelValve ]
              default: SetGelValve
            parameters:
              type: object
              required: [ isOpen ]
              properties:
                isOpen:
                  type: boolean
                  description: Indicates whether the gel valve should be opened
